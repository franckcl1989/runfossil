[package]
name = "runfossil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "runfossil"
path = "src/main.rs"

[dependencies]
runfossil-core = { path = "../runfossil-core" }
runfossil-net = { path = "../runfossil-net" }
runfossil-pack = { path = "../runfossil-pack" }
runfossil-plan = { path = "../runfossil-plan" }
runfossil-proc = { path = "../runfossil-proc" }
runfossil-service = { path = "../runfossil-service" }
runfossil-store = { path = "../runfossil-store" }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"
tar = "0.4"
zstd = { version = "0.13", default-features = false }
