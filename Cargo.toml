[workspace]
members = [
    "crates/runfossil-cli",
    "crates/runfossil-core",
    "crates/runfossil-container",
    "crates/runfossil-fs",
    "crates/runfossil-net",
    "crates/runfossil-pack",
    "crates/runfossil-plan",
    "crates/runfossil-proc",
    "crates/runfossil-service",
    "crates/runfossil-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/franckcl1989/runfossil"

[workspace.lints.rust]
missing_debug_implementations = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
