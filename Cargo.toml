[workspace]
members = [
    "crates/runfossil-cli",
    "crates/runfossil-core",
    "crates/runfossil-fs",
    "crates/runfossil-net",
    "crates/runfossil-pack",
    "crates/runfossil-plan",
    "crates/runfossil-proc",
    "crates/runfossil-service",
    "crates/runfossil-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/franckcl1989/runfossil"

[workspace.lints.rust]
missing_debug_implementations = "deny"
missing_docs = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "forbid"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Release profile: optimize for size and performance.
# LTO, single codegen unit, and abort-on-panic yield the smallest binary.
# opt-level=3 for maximum runtime performance; codegen-units=1 and
# panic=abort strip unwinding tables.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# The dev profile inherits from the default settings.
[profile.dev]
opt-level = 0

# Benchmark profile: similar to release for meaningful perf numbers.
[profile.bench]
opt-level = 3
lto = false
debug = false
